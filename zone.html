        /* CINEMATIC FULL IMMERSION OVERLAY */
        #immersionOverlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #FAF2E2 0%, #F7E9CE 60%, #DDB86C 100%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            clip-path: circle(0% at 50% 50%);
            transition: opacity 0.8s ease, clip-path 1.2s cubic-bezier(0.77, 0, 0.175, 1);
        }

        #immersionOverlay.active {
            opacity: 1;
            pointer-events: auto;
            clip-path: circle(150% at 50% 50%);
        }

        /* Portal Rings Effect */
        .portal-container {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 640px) {
            .portal-container {
                width: 140px;
                height: 140px;
            }
        }

        .portal-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid transparent;
            box-shadow: 0 0 25px rgba(197, 143, 44, 0.6);
        }

        .ring-1 {
            inset: 0;
            border-top-color: #C58F2C;
            border-right-color: #8C6219;
            animation: rotateClockwise 2s linear infinite;
        }

        .ring-2 {
            inset: 10px;
            border-bottom-color: #B88728;
            border-left-color: #FAF2E2;
            animation: rotateCounter 1.5s linear infinite;
        }

        .ring-3 {
            inset: 20px;
            border-top-color: #8C6219;
            border-left-color: #C58F2C;
            animation: rotateClockwise 2.8s linear infinite;
        }

        .portal-icon {
            font-size: 28px;
            color: #8C6219;
            animation: pulseGlow 1.8s ease-in-out infinite;
        }

        @keyframes rotateClockwise {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateCounter {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(197, 143, 44, 0.5)); }
            50% { transform: scale(1.18); filter: drop-shadow(0 0 20px rgba(197, 143, 44, 0.9)); }
        }

        .sparkle {
            position: absolute;
            color: #C58F2C;
            font-size: 16px;
            opacity: 0;
            animation: floatSparkle 2s ease-in-out infinite;
        }

        .sp-1 { top: -15px; left: 10px; animation-delay: 0s; }
        .sp-2 { top: 25px; right: -20px; animation-delay: 0.5s; }
        .sp-3 { bottom: -15px; right: 10px; animation-delay: 1s; }
        .sp-4 { bottom: 25px; left: -20px; animation-delay: 1.5s; }

        @keyframes floatSparkle {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 1; transform: translateY(-8px) scale(1.2); }
            100% { transform: translateY(-16px) scale(0.5); opacity: 0; }
        }

        .gold-shimmer {
            background: linear-gradient(90deg, #8C6219 0%, #C58F2C 50%, #8C6219 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShimmer 2s linear infinite;
        }

        @keyframes goldShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        #immersionOverlay.active .progress-fill {
            animation: fillProgress 1.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

                    "Облысқа танымал кәсіпкер, қолөнер шеберлерінің туындыларынан сатылым алаңдары (Д.Марлен 10 дана, Ә.Елешова 6 дана, Қ.Ілиясова 5 дана, А.Әлайдарова 5 дана, А.Әбди 20 дана, Ә.Аймұратова 10 дана).",
                    "«Қайсар» футбол клубының ресми формасы (10 дана) және «Далатекс» ЖШС-нің коллекциялары (12 дана).",
                    "А.Жұмағұлованың «Сыр style collection» киімдерінен топтама, дизайнерлер Дана Марлен мен Әсел Елешованың сатылым және сән көрсетілімі."
                ],
                budget: "16 500 000 тг (50 дана)"
            },
            11: {
                title: "Қызылорда Talks-қа арнайы алаң №11",
                desc: "Танымал тұлғалармен сұхбат, бейне түсірілім және креативті индустрия трендтері туралы ашық диалог студиясы.",
                images: ["images/zone11.jpg"],
                details: [
                    "Танымал тұлғалармен креативті индустрияның трендтері мен жаңа мүмкіндіктері туралы ашық диалог пен сұхбат аймағы.",
                    "«Kyzylorda Talks» ресми брендтік сұхбат және бейне түсірілім студиясы."
                ],
                budget: null
            }
        };

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || '1';
        }

        const currentZoneId = parseInt(getQueryParam('id')) || 1;

        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('loaded');
            renderZone(currentZoneId);
        });

        function renderZone(id) {
            const data = zonesData[id] || zonesData[1];
            document.getElementById('zoneNumber').innerText = `#${id}`;
            document.getElementById('zoneTitle').innerText = data.title;
            document.getElementById('zoneDesc').innerText = data.desc;
            document.title = `${data.title} — CREATIVE AIMAQ`;

            document.querySelectorAll('[class^="zone-nav-btn-"]').forEach(btn => {
                btn.classList.remove('bg-[#059669]', 'text-white');
                btn.classList.add('bg-[#F7E9CE]', 'text-[#4A3515]');
            });
            const activeBtn = document.querySelector(`.zone-nav-btn-${id}`);
            if(activeBtn) {
                activeBtn.classList.remove('bg-[#F7E9CE]', 'text-[#4A3515]');
                activeBtn.classList.add('bg-[#059669]', 'text-white');
            }

            const contentArea = document.getElementById('contentArea');

            if (data.images && data.images.length > 0) {
                let imagesHTML = data.images.map((imgSrc, idx) => `
                    <div class="w-full large-image-frame rounded-xl sm:rounded-2xl overflow-hidden p-1.5 sm:p-4 mb-4 sm:mb-6">
                        <div class="w-full text-center mb-1.5 sm:mb-2 flex justify-between items-center px-1.5">
                            <span class="text-[10px] sm:text-xs font-bold text-[#8C6219] uppercase tracking-widest">
                                <i class="fa-solid fa-expand text-[10px] mr-1"></i> Крупный план (${idx + 1}/${data.images.length})
                            </span>
                            <span class="text-[10px] sm:text-xs text-[#4A3515]/60 font-semibold">№${id} Экспозиция сұлбасы</span>
                        </div>
                        <img src="${imgSrc}" alt="${data.title} ${idx + 1}" 
                             class="w-full h-auto object-contain max-h-[85vh] mx-auto block rounded-md sm:rounded-lg">
                    </div>
                `).join('');

                let detailsHTML = '';
                if (data.details && data.details.length > 0) {
                    detailsHTML = `
                        <div class="space-y-3">
                            <h4 class="font-bold text-[#8C6219] font-cinzel text-sm sm:text-base flex items-center gap-2">
                                <i class="fa-solid fa-circle-check text-[#059669] text-xs sm:text-sm"></i>
                                <span>Аймақ бойынша толық сипаттама мен ерекшеліктер:</span>
                            </h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4">
                                ${data.details.map(detail => `
                                    <div class="bg-[#FAF2E2] p-3 sm:p-4 rounded-xl border border-[#C58F2C]/30 shadow-sm flex items-start gap-2.5 sm:gap-3">
                                        <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#C58F2C] mt-1.5 flex-shrink-0"></span>
                                        <span class="text-xs sm:text-sm text-[#4A3515]/90 font-medium">${detail}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                let budgetHTML = '';
                if (data.budget) {
                    budgetHTML = `
                        <div class="inline-flex items-center gap-2.5 sm:gap-3 bg-gradient-to-r from-[#059669] to-[#047857] text-white px-4 py-2.5 sm:px-6 sm:py-3.5 rounded-xl shadow-md font-bold text-xs sm:text-base">
                            <i class="fa-solid fa-coins text-sm sm:text-xl"></i>
                            <span>Жалпы Бюджеті: ${data.budget}</span>
                        </div>
                    `;
                }

                contentArea.innerHTML = `
                    <div class="space-y-6 sm:space-y-8">
                        ${imagesHTML}

                        <!-- DETAILS & BUDGET SECTION BELOW THE LARGE PHOTOS -->
                        <div class="space-y-5 sm:space-y-6 bg-[#FAF2E2] p-4 sm:p-8 rounded-xl sm:rounded-2xl border border-[#C58F2C]/30 shadow-md">
                            ${detailsHTML}
                            ${budgetHTML}
                        </div>
                    </div>
                `;
            } else {
                contentArea.innerHTML = `
                    <div class="w-full material-card rounded-xl sm:rounded-2xl p-8 sm:p-16 text-center space-y-3 sm:space-y-4 bg-[#FAF2E2] border-2 border-dashed border-[#C58F2C]/40">
                        <div class="w-14 h-14 sm:w-20 sm:h-20 rounded-full bg-[#C58F2C]/15 text-[#8C6219] flex items-center justify-center mx-auto text-xl sm:text-3xl">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>
                        <h4 class="text-base sm:text-xl font-bold text-[#8C6219] font-cinzel">№${id} аймақ бойынша суреттер күтілуде</h4>
                        <p class="text-xs sm:text-sm text-[#4A3515]/70 max-w-md mx-auto">
                            Осы залдың суреттерін жібергеннен кейін олар осы бөлімде КРУПНЫЙ ПЛАНМЕН толық сипаттамасымен орналастырылады.
                        </p>
                    </div>
                `;
            }
        }

        function switchZone(id) {
            const overlay = document.getElementById('immersionOverlay');
            const overlayText = document.getElementById('immersionText');
            overlayText.innerText = `№${id} АЙМАҚҚА ПОЛНОЕ ПОГРУЖЕНИЕ...`;

            overlay.classList.add('active');
            document.body.classList.add('diving');

            setTimeout(() => {
                window.location.href = `zone.html?id=${id}`;
            }, 1500);
        }

        function goBack() {
            const overlay = document.getElementById('immersionOverlay');
            const overlayText = document.getElementById('immersionText');
            overlayText.innerText = `БАСТЫ КАРТАҒА ПОЛНОЕ ПОГРУЖЕНИЕ...`;

            overlay.classList.add('active');
            document.body.classList.add('diving');

            setTimeout(() => {
                window.location.href = `index.html#plan-section`;
            }, 1500);
        }
    </script>
</body>
</html>
